<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" role="img" aria-labelledby="title desc">
  <title id="title">AI agents, retrieval and backend systems</title>
  <desc id="desc">Three engineering focus areas connected by a lime signal line on an ink-dark grid.</desc>
  <defs>
